<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
	<!-- Демо-изображение для вложения «IMG_4521.jpg» из демо-данных: мокрые документы у барабана стиральной машины -->
	<defs>
		<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#d9dde2" />
			<stop offset="1" stop-color="#b9bfc7" />
		</linearGradient>
		<radialGradient id="glass" cx="0.4" cy="0.35" r="0.8">
			<stop offset="0" stop-color="#5b6672" />
			<stop offset="1" stop-color="#1d2329" />
		</radialGradient>
	</defs>
	<rect width="1200" height="900" fill="url(#wall)" />
	<!-- корпус стиральной машины -->
	<rect x="150" y="60" width="900" height="840" rx="36" fill="#f4f5f6" />
	<rect x="150" y="60" width="900" height="150" rx="36" fill="#e6e8ea" />
	<circle cx="260" cy="135" r="26" fill="#9aa3ad" />
	<rect x="340" y="115" width="260" height="40" rx="10" fill="#cfd4d9" />
	<!-- люк и барабан -->
	<circle cx="600" cy="540" r="290" fill="#d5d9dd" />
	<circle cx="600" cy="540" r="250" fill="#aeb5bc" />
	<circle cx="600" cy="540" r="215" fill="url(#glass)" />
	<!-- мокрые листы внутри барабана -->
	<g transform="rotate(-14 560 560)">
		<rect x="440" y="470" width="230" height="290" rx="6" fill="#efe7c4" />
		<rect x="462" y="500" width="150" height="10" fill="#b9ae83" />
		<rect x="462" y="530" width="180" height="10" fill="#b9ae83" />
		<rect x="462" y="560" width="120" height="10" fill="#b9ae83" />
		<ellipse cx="560" cy="650" rx="70" ry="42" fill="#cfc48f" opacity="0.7" />
	</g>
	<g transform="rotate(11 660 520)">
		<rect x="560" y="400" width="210" height="270" rx="6" fill="#f3efd7" />
		<rect x="582" y="432" width="140" height="10" fill="#c2b88c" />
		<rect x="582" y="462" width="160" height="10" fill="#c2b88c" />
		<ellipse cx="660" cy="590" rx="62" ry="36" fill="#d8cd98" opacity="0.7" />
	</g>
	<!-- капли воды -->
	<g fill="#8fb4d8" opacity="0.85">
		<ellipse cx="500" cy="380" rx="12" ry="18" />
		<ellipse cx="720" cy="360" rx="10" ry="15" />
		<ellipse cx="640" cy="700" rx="14" ry="20" />
		<ellipse cx="470" cy="660" rx="9" ry="13" />
	</g>
	<!-- блик на стекле -->
	<ellipse cx="520" cy="420" rx="90" ry="40" fill="#ffffff" opacity="0.12" transform="rotate(-30 520 420)" />
</svg>
